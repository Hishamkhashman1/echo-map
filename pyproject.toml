[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-map"
version = "0.1.0"
description = "Experimental single-speaker, single-microphone acoustic sensing"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "matplotlib>=3.7",
  "sounddevice>=0.4.6",
]

[project.scripts]
echo-map = "echomap.cli:main"

[project.optional-dependencies]
room = ["pyroomacoustics>=0.7"]

[tool.setuptools.packages.find]
include = ["echomap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
